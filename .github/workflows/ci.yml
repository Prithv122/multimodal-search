name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Fast job must not have torch
        run: |
          uv run python -c "import importlib.util, sys; sys.exit(1 if importlib.util.find_spec('torch') else 0)"

      - name: Test
        run: uv run pytest --cov=src --cov-report=term-missing

      - name: Fixture stats
        run: uv run mmsearch stats --fixture planted

      - name: Planted effect is detected on the test split
        run: uv run mmsearch eval --fixture planted --split test --resamples 2000
